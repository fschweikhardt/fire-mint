services:
  app:
    build: .
    container_name: fire-mint-app
    ports:
      - "${PORT:-7860}:7860"
    environment:
      HOST: 0.0.0.0
      PORT: 7860
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
