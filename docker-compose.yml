services:
  app:
    build: .
    container_name: fire-mint-app
    ports:
      - "${PORT:-7860}:7860"
    volumes:
      - ./app.py:/app/app.py
    environment:
      HOST: 0.0.0.0
      PORT: 7860
    restart: unless-stopped
    develop:
      watch:
        - path: ./app.py
          action: restart
