# CI and deploy to Fly.io
# Set APP_NAME to match fly/fly.toml (lowercase, globally unique on Fly)

name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: fire-mint

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker image builds
        run: docker build -t app:ci .

  deploy:
    name: deploy
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute image names
        id: img
        run: |
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "app=ghcr.io/${repo}/app" >> "$GITHUB_OUTPUT"
          echo "fly_app=registry.fly.io/${{ env.APP_NAME }}" >> "$GITHUB_OUTPUT"

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Fly cannot pull private GHCR images — mirror to registry.fly.io instead.
      - name: Authenticate Docker to Fly registry
        run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.app }}:${{ github.sha }}
            ${{ steps.img.outputs.app }}:latest
            ${{ steps.img.outputs.fly_app }}:${{ github.sha }}

      - name: Verify Fly API token
        run: flyctl auth whoami
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy app
        run: |
          flyctl deploy \
            --config fly/fly.toml \
            --image "${{ steps.img.outputs.fly_app }}:${{ github.sha }}" \
            --app "${{ env.APP_NAME }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
